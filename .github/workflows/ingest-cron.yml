name: Ingest Cron

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    name: Trigger scheduled data ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call ingestion cron endpoint
        run: >-
          curl --fail --silent --show-error --max-time 240
          -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
          "${{ secrets.PLANTGEO_APP_URL }}/api/cron/ingest"
