name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: plantgeo-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply verified Drizzle migrations to plantgeo-main's database
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.RAILWAY_PRODUCTION_DEPLOY_ENABLED == 'true' &&
      vars.RAILWAY_PRODUCTION_DATA_CERTIFIED_SHA == github.event.workflow_run.head_sha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Schema changes get their own approval gate, distinct from the
    # code-deploy gate on the `production` environment below.
    environment: production-migrations

    steps:
      - name: Fail fast when the migration DSN is not configured
        run: test -n "$DATABASE_URL" || { echo "PRODUCTION_MIGRATION_DATABASE_URL is not configured"; exit 1; }
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}

      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The plantgeo-main runtime image is an intentionally migration-free
      # Next.js standalone build (see docs/deployment.md — "Database
      # replacement gate"), so migrations run here, against the exact
      # certified revision, gated by the same human-approved deploy vars,
      # and only against the target that PRODUCTION_MIGRATION_DATABASE_URL
      # is scoped to.
      - name: Apply Drizzle migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}

  deploy:
    name: Deploy verified web revision to Railway
    needs: migrate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.RAILWAY_PRODUCTION_DEPLOY_ENABLED == 'true' &&
      vars.RAILWAY_PRODUCTION_DATA_CERTIFIED_SHA == github.event.workflow_run.head_sha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install pinned Railway CLI
        run: npm install -g @railway/cli@5.27.0

      - name: Deploy PlantGeo web service
        run: >-
          railway up
          --project 6faaf3ea-ac46-4c8b-bbfe-1351dbb9d990
          --environment production
          --service plantgeo-main
          --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
