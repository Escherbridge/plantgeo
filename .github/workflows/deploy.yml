name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: plantgeo-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified web revision to Railway
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.RAILWAY_PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pinned Railway CLI
        run: npm install -g @railway/cli@5.27.0

      - name: Deploy PlantGeo web service
        run: >-
          railway up
          --project 6faaf3ea-ac46-4c8b-bbfe-1351dbb9d990
          --environment production
          --service plantgeo-main
          --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
