target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "A", "COM", "C4", "DTZ", "ISC", "PIE", "PT", "RSE", "RET", "SIM", "TID", "TCH", "ARG", "ERA", "PL", "PERF", "RUF"]
ignore = ["ANN401", "COM812", "ISC001"]
# Minus/dash variants and a curly apostrophe are DATA in the strategy eval scorer: the JSON-escape
# regression it guards against (`_DASH_NORMALISATION_TABLE`) and a model's typographic "don't" both
# need the literal ambiguous character, not a plain hyphen or straight quote (RUF001/RUF002/RUF003).
allowed-confusables = ["−", "‒", "–", "’"]

[lint.isort]
known-first-party = ["agri_data_service"]

[lint.per-file-ignores]
"scripts/air_temperature_snapshot_breakdown.py" = ["PLR0912", "PLR0913", "PLR0915"]
