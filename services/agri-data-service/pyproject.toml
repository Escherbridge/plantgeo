[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agri-data-service"
version = "0.1.0"
description = "Regenerative agriculture data warehouse and API for PlantGeo"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.121",
    "sanic>=24.6",
    "sanic-ext>=23.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "geoalchemy2>=0.15",
    "pgvector>=0.3",
    "alembic>=1.13",
    "structlog>=24.1",
    "click>=8.1",
    "httpx>=0.27",
    "redis>=5.0,<6",
    "pyshp>=2.3,<3",
    "filelock>=3.15",
    "psycopg2-binary>=2.9",
    "duckdb>=1.1,<2",
    "pyarrow>=17,<22",
    "polars>=1.17,<2",
    "boto3>=1.35,<2",
    "s3fs>=2024.6",
    "cdsapi>=0.7,<1",
    "h5py>=3.13,<4",
    "h5netcdf>=1.6,<2",
    "xarray>=2025.1,<2027",
    "numpy>=2,<3",
    "scikit-learn>=1.5,<2",
    "rasterio>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-sanic>=1.9",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-psycopg2>=2.9",
    "factory-boy>=3.3",
]

[project.scripts]
agri-service = "agri_data_service.interface.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/agri_data_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
