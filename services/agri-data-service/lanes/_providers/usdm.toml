# U.S. Drought Monitor: the facts every lane on this provider shares (spec S3).
# Data only. Schema: foundation/lane_config/models.py::ProviderConfig. Authoring: lanes/AGENTS.md.
# Sources: ingest/usdm.py::USDM_BASE_URL / usdm_source_url / USDM_BOUNDS; docs/lanes/drought.md
# section 1 ("Keyless"). Shipped inert: no lane names it yet (s-drought).

id = "usdm"
display_name = "U.S. Drought Monitor"
# Keyless and uncharged: no api_key_env, no [weight], no [budget].
weighted = false
# Rate posture: unpublished. One national release file per week (~19 MB, read under a 48 MiB / 60 s
# bound, ingest/usdm.py::USDM_BOUNDS); a missing release is a 404 the lane reads as `unsettled` (spec §7).

# One dated release, `release` = the valid date as YYYYMMDD, so the URL equals
# ingest/usdm.py::usdm_source_url (a templated endpoint sends no bare `?`). Template rules:
# foundation/lane_config/AGENTS.md.
[endpoints.release]
host = "droughtmonitor.unl.edu"
path = "/data/json"
path_template = "/data/json/usdm_{release}.json"
