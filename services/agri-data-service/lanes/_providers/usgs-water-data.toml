# USGS Water Data APIs (OGC API - Features): the facts every lane on this provider shares (spec S3).
# Data only. Schema: foundation/lane_config/models.py::ProviderConfig. Authoring: lanes/AGENTS.md.
# Every fact below was observed by probe P4 on 2026-09-28: docs/lanes/water-gauges.md "Source probe".

id = "usgs-water-data"
display_name = "USGS Water Data APIs"
# Uncharged: no [weight], no [budget]. A turn is capped in logical requests.
weighted = false
# Optional (api.data.gov): a key only raises the rate limit. It travels in a header, never the query,
# so no URL, log line or checkpoint identity can carry it (docs/lanes/water-gauges.md 8.4).
api_key_env = "USGS_WATER_DATA_API_KEY"
api_key_transport = "header"
api_key_header = "X-Api-Key"

[endpoints.daily]
host = "api.waterdata.usgs.gov"
path = "/ogcapi/v1/collections/daily/items"
optional_api_key = true

[endpoints.monitoring-locations]
host = "api.waterdata.usgs.gov"
path = "/ogcapi/v1/collections/monitoring-locations/items"
optional_api_key = true
