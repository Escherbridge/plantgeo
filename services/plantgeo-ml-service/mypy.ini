[mypy]
python_version = 3.12
strict = true
# `scripts/regenerate_parity_fixtures.py` imports the shared case definitions that live beside the
# tests, so the type-checker has to look there even though `tests` is outside the checked scope.
mypy_path = tests

[mypy-sanic_ext.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True
