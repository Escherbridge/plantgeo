[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plantgeo-ml-service"
version = "0.1.0"
description = "PlantGeo machine-learning and Monte Carlo service, fed by Parquet, zero Postgres"
requires-python = ">=3.12"
dependencies = [
    "sanic>=24.6",
    "sanic-ext>=23.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "click>=8.1",
    "numpy>=2,<3",
    "polars>=1.17,<2",
    "pyarrow>=17,<22",
    "duckdb>=1.1,<2",
    "boto3>=1.35,<2",
    # The ONE HTTP client, for `pipeline/sources/` (spec FR-12). `method/` may not import it and the
    # layer import contract enforces that.
    "httpx>=0.27",
    "scikit-learn>=1.5,<2",
    # The IANA time-zone database as a package. `pa.timestamp(tz="UTC")` decodes through
    # `zoneinfo`, which on Windows has no OS database to fall back to and on Linux inherits
    # whatever the base image ships. Declaring it pins ONE tz database for every host.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-sanic>=1.9",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
plantgeo-ml = "plantgeo_ml_service.interface.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/plantgeo_ml_service"]
# The compiled Mojo kernels are gitignored build output, and hatchling honours VCS ignore rules,
# so without this line the wheel the Docker runtime stage installs would silently omit them and
# `PLANTGEO_ML_KERNELS=mojo` would refuse to start inside an image that did build them.
artifacts = ["src/plantgeo_ml_service/method/kernels/_native/*.so"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
