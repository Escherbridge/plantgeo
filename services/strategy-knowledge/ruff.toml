# Same rule selection as services/agri-data-service/ruff.toml. `TC` is ruff's current name for the
# flake8-type-checking rules that agri-data-service's older ruff selects as `TCH`.
target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "A", "COM", "C4", "DTZ", "ISC", "PIE", "PT", "RSE", "RET", "SIM", "TID", "TC", "ARG", "ERA", "PL", "PERF", "RUF"]
ignore = ["ANN401", "COM812", "ISC001"]

[lint.isort]
known-first-party = ["strategy_knowledge"]

[lint.flake8-type-checking]
# Pydantic resolves annotations at runtime, so its models' imports must not move under TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[lint.per-file-ignores]
# Tool signatures mirror the MCP contract of DESIGN.md section 11: one parameter per filter.
"src/strategy_knowledge/server.py" = ["PLR0913", "PLR0915"]
"tests/**" = ["PLR2004"]
