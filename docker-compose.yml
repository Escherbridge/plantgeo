services:
  # ============================================
  # PostGIS Database
  # ============================================
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: plantgeo
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # postgis/postgis defaults PGDATA to /var/lib/postgresql/data (uid 999); the old
      # timescale/timescaledb-ha image used /home/postgres/pgdata/data instead.
      - postgis_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d plantgeo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Redis Cache + Pub/Sub
  # ============================================
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Tile service (static PMTiles are served from R2/CDN in production)
  # ============================================

  martin:
    build:
      context: .
      dockerfile: Dockerfile.martin
    image: plantgeo-martin:1.10.1
    environment:
      DATABASE_URL: postgresql://geo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgis:5432/plantgeo
      PORT: 3000
      # Local-dev default only. infra/martin/martin.yaml's cors.origin is a real multi-entry
      # list, one placeholder per allowed origin -- this var fills only the custom-domain
      # entry. Never comma-join multiple origins here: Martin expands one placeholder into
      # exactly one scalar and will not split it (see the comment in martin.yaml).
      TILE_CORS_ORIGIN: ${TILE_CORS_ORIGIN:-http://localhost:3001}
      MARTIN_CACHE_SIZE_MB: ${MARTIN_CACHE_SIZE_MB:-128}
      MARTIN_POOL_SIZE: ${MARTIN_POOL_SIZE:-8}
    ports:
      - "127.0.0.1:${MARTIN_HOST_PORT:-3100}:3000"
    depends_on:
      postgis:
        condition: service_healthy
    restart: unless-stopped

