services:
  plantgeo-warehouse:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: timescale/timescaledb-ha@sha256:9965a1682187e30d36a24e303b77f1b265ff7458b383eb3304dd1d8d65edb3fc
    image: localhost/plantgeo-spatiotemporal:pg16
    user: "0:0"
    environment:
      POSTGRES_DB: plantgeo
      POSTGRES_USER: plantgeo_owner
      POSTGRES_PASSWORD: ${PLANTGEO_LOCAL_DB_PASSWORD:?Set PLANTGEO_LOCAL_DB_PASSWORD in your shell or .env}
      PGDATA: /home/postgres/pgdata/data
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - plantgeo_warehouse_pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantgeo_owner -d plantgeo"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  plantgeo_warehouse_pgdata:
    name: plantgeo_warehouse_pgdata
