# yaml-language-server schema: https://raw.githubusercontent.com/maplibre/martin/martin-v1.10.1/schemas/config.json
# Public dynamic tiles are intentionally limited to the vetted geo functions.

listen_addresses: "0.0.0.0:${PORT:3000}"
on_invalid: abort

cors:
  max_age: 86400
  # Each entry below is its OWN "${VAR:default}" placeholder. Martin expands env vars into the
  # YAML text before parsing (the `subst` crate, single-colon default syntax -- verified against
  # subst v0.3.8, the version this Martin v1.10.1 build actually vendors), so one placeholder can
  # only ever yield one scalar. It does not re-parse a substituted value as YAML, so a comma-
  # separated TILE_CORS_ORIGIN would NOT expand into a two-item list -- it would become one
  # literal "a,b" origin string that matches no real browser Origin header, silently blocking
  # BOTH origins behind a clean `curl` 200 (verified against Martin source: cors.origin is a
  # Vec<String> matched with exact string equality, martin/src/config/file/cors.rs). This is why
  # 2026-08-17's outage happened: this list held exactly one entry, so setting TILE_CORS_ORIGIN to
  # either live domain necessarily blocked the other.
  #
  # So: one placeholder per allowed origin, and each placeholder's default is the currently-
  # correct value -- this list is right even if Railway sets neither var. TILE_CORS_ORIGIN keeps
  # its existing name/default; Railway already carries the corrected value for it, no Railway
  # change needed. TILE_CORS_ORIGIN_RAILWAY_DOMAIN is new and its default already matches the
  # Railway-provided service domain, so it too needs no Railway variable unless that domain is
  # later rotated. Adding a THIRD domain to the plantgeo-main service is a new line here, in the
  # same commit that adds the domain -- see docs/deployment.md's "Martin CORS" note.
  origin:
    - "${TILE_CORS_ORIGIN:http://localhost:3001}"
    - "${TILE_CORS_ORIGIN_RAILWAY_DOMAIN:https://plantgeo-main-production.up.railway.app}"

cache:
  size_mb: ${MARTIN_CACHE_SIZE_MB:128}
  tile_size_mb: 64
  tile_expiry: 5m
  maxzoom: 14

postgres:
  connection_string: ${DATABASE_URL}
  pool_size: ${MARTIN_POOL_SIZE:8}
  default_srid: 4326
  auto_bounds: skip
  max_feature_count: 10000
  auto_publish: false
  # Source ids are bare (no schema prefix) to match what the deployed Martin
  # auto-publishes today; the client composes them in src/lib/map/sources.ts.
  functions:
    fire_risk_tiles:
      schema: geo
      function: fire_risk_tiles
    sensor_tiles:
      schema: geo
      function: sensor_tiles
    intervention_tiles:
      schema: geo
      function: intervention_tiles
    building_tiles:
      schema: geo
      function: building_tiles
    evacuation_zone_tiles:
      schema: geo
      function: evacuation_zone_tiles
    burn_severity_tiles:
      schema: geo
      function: burn_severity_tiles
    watershed_tiles:
      schema: geo
      function: watershed_tiles
  tables:
    osm_roads:
      schema: geo
      table: osm_roads
      srid: 4326
      geometry_column: geom
      geometry_type: LINESTRING
    osm_waterways:
      schema: geo
      table: osm_waterways
      srid: 4326
      geometry_column: geom
      geometry_type: GEOMETRY
