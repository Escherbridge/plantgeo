# infra/tiles/serve/nginx.pmtiles.conf
#
# Static PMTiles archive server for the Railway-volume serving plane.
# Serves the North America basemap archive built by ../build-na.sh directly
# off a Railway persistent volume mounted at /data/tiles.
#
# Why this needs its own config rather than reusing infra/nginx/nginx.conf:
# that config is a reverse proxy in front of Martin/Valhalla/Photon with
# gzip on and no range-request handling; PMTiles is a binary format that
# pmtiles-js (pmtiles@^4.2.0, see src/lib/map/sources.ts) reads with many
# small HTTP Range requests, so this server must:
#   - NOT gzip .pmtiles responses (already-compact binary; gzip breaks the
#     byte-offset math pmtiles-js relies on for range reads and wastes CPU)
#   - support byte-range requests (nginx does this by default for static
#     `root`-served files; the settings below tune it for a large file
#     read with many concurrent small reads rather than one sequential read)
#   - expose CORS headers covering the preflight that browsers send for
#     Range requests, and explicitly expose Content-Range/Content-Length/
#     Accept-Ranges so pmtiles-js can read them cross-origin
#   - set long, immutable Cache-Control — safe ONLY because the deploy step
#     in docs/runbooks/pmtiles-pnw.md uses a content-versioned filename
#     (e.g. north-america-2026-08-02.pmtiles) and an atomic swap, so a
#     given URL's bytes never change after first publish

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Threaded AIO + directio for large-file random-access reads: without
    # this, a single big sequential-style read of a many-GB file can block
    # an nginx worker. directio is set above typical range-request chunk
    # sizes pmtiles-js issues (it fetches header/dir sections in small
    # chunks, tile data in variable-size chunks) so small reads still hit
    # the page cache while very large ones go direct.
    aio threads;
    directio 4m;
    sendfile on;
    sendfile_max_chunk 2m;
    tcp_nopush on;

    # PMTiles archives are already compressed internally (gzip/brotli per
    # tile, depending on how Planetiler wrote them); do not double-gzip the
    # container response.
    gzip off;

    log_format tiles '$remote_addr - [$time_local] "$request" '
                      'status=$status bytes=$body_bytes_sent '
                      'range="$http_range" referer="$http_referer" '
                      'ua="$http_user_agent"';
    access_log /dev/stdout tiles;
    error_log  /dev/stderr warn;

    server {
        # Fixed port, not $PORT: this container does not run nginx's
        # envsubst-on-templates entrypoint step (we ship a plain
        # nginx.conf, not a *.template), so it does not read Railway's
        # injected PORT env var. Set this service's target port to 8080
        # explicitly under Railway > Settings > Networking. See
        # docs/runbooks/pmtiles-pnw.md.
        listen 8080;
        server_name _;

        root /data/tiles;

        # Railway healthcheck target (see serve/pmtiles-server.railway.json).
        location = /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        location ~ \.pmtiles$ {
            # Range requests are handled by nginx's static file module
            # automatically (Accept-Ranges: bytes is added by default for
            # files served via `root`); the headers below are the ones
            # nginx does NOT add automatically and that pmtiles-js needs.
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, If-Range, If-None-Match" always;
            add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Range, If-Range, If-None-Match" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # Everything else under /data/tiles is intentionally 404 — this
        # server has exactly one job.
        location / {
            try_files $uri =404;
        }
    }
}
